# Local development environment that mirrors the Railway/prod Docker setup
# (same Dockerfile, same nginx + php-fpm via supervisor) plus a stable MySQL 8
# so migrations can be tested locally instead of on production.
#
# Quick start (see DOCKER_LOCAL.md for the full flow):
#   docker compose up -d db        # start the database first
#   ...import a backup if you want real data...
#   docker compose up app          # build + start the app (runs migrations)
#
# App:     http://localhost:8000
# Adminer: http://localhost:8081   (DB browser)
# MySQL:   127.0.0.1:3307          (connect from Workbench/host)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: frogmendash-app
    ports:
      - "8000:8080"            # host 8000 -> nginx (PORT 8080 inside)
    environment:
      PORT: 8080
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Point the app at the db service (overrides .env inside the container).
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-frogmendb}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/app                 # live code editing
      - /app/vendor            # keep the image's installed deps
      - /app/node_modules      # keep the image's node deps
      - /app/public/build      # keep the image's built assets
      - /app/bootstrap/cache   # use image's --no-dev package manifest, not the host's
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-frogmendb}
    ports:
      - "3307:3306"            # host 3307 -> avoids clashing with XAMPP's 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
